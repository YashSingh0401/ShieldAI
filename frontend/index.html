<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="shieldAI is a modern security portal designed to verify image manipulation layers (ELA) and audit lexical URL phishing patterns." />
    <title>shieldAI | Security Verification Portal</title>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        const div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100vw';
        div.style.height = '100vh';
        div.style.backgroundColor = '#1a0505';
        div.style.color = '#ff6b6b';
        div.style.padding = '40px';
        div.style.fontFamily = 'monospace';
        div.style.zIndex = '999999';
        div.style.overflow = 'auto';
        div.style.boxSizing = 'border-box';
        div.innerHTML = '<h2>🔴 Unhandled Runtime Error</h2>' +
                        '<p><strong>Message:</strong> ' + message + '</p>' +
                        '<p><strong>Source:</strong> ' + source + ' (Line: ' + lineno + ', Col: ' + colno + ')</p>' +
                        '<pre style="white-space: pre-wrap; background: #2d0c0c; padding: 15px; border-radius: 8px; margin-top: 15px;"><strong>Stack Trace:</strong>\n' + (error && error.stack ? error.stack : 'N/A') + '</pre>';
        document.body.appendChild(div);
        return false;
      };
      window.onunhandledrejection = function(event) {
        const div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100vw';
        div.style.height = '100vh';
        div.style.backgroundColor = '#1a0505';
        div.style.color = '#ff6b6b';
        div.style.padding = '40px';
        div.style.fontFamily = 'monospace';
        div.style.zIndex = '999999';
        div.style.overflow = 'auto';
        div.style.boxSizing = 'border-box';
        div.innerHTML = '<h2>🔴 Unhandled Promise Rejection</h2>' +
                        '<p><strong>Reason:</strong> ' + (event.reason && event.reason.stack ? event.reason.stack : event.reason) + '</p>';
        document.body.appendChild(div);
      };
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
