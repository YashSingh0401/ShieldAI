name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install ffmpeg (real analysis paths)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -q
      - name: Regenerate benchmark samples and run benchmark
        run: python benchmark_data/generate_samples.py && python benchmark.py

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  docker:
    name: Backend image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t shieldai-backend backend/
      - name: Smoke test container
        run: |
          docker run --rm -d -p 8000:8000 --name shieldai-test shieldai-backend
          sleep 8
          curl -sf http://127.0.0.1:8000/health | grep -q '"status":"ok"'
          curl -sf "http://127.0.0.1:8000/verify/url?url=example.com" | grep -q '"risk_score"'
          docker stop shieldai-test
